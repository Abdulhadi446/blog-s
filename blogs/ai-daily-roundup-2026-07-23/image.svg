<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="b"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow circles -->
  <circle cx="200" cy="150" r="180" fill="#4f46e5" opacity="0.3" filter="url(#blur)"/>
  <circle cx="1000" cy="500" r="220" fill="#ec4899" opacity="0.25" filter="url(#blur)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Central Card Container -->
  <rect x="100" y="90" width="1000" height="450" rx="24" fill="#090d16" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Accent bar top of card -->
  <rect x="100" y="90" width="1000" height="6" rx="3" fill="url(#glow)"/>

  <!-- Badge -->
  <rect x="140" y="135" width="220" height="36" rx="18" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8" stroke-width="1"/>
  <text x="250" y="158" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">AI DAILY ROUNDUP</text>

  <!-- Date -->
  <text x="1020" y="158" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" text-anchor="end">July 23, 2026</text>

  <!-- Main Headline -->
  <text x="140" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800">Gemini 3.6 Flash, Claude Sonnet 5</text>
  <text x="140" y="295" fill="url(#glow)" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800">&amp; Kimi K3 Breakthroughs</text>

  <!-- Subtitle / Description -->
  <text x="140" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Exploring 10 major AI developments: open-weights shifts,</text>
  <text x="140" y="390" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">custom inference silicon, and advanced agentic workflows.</text>

  <!-- Footer Stats / Tags -->
  <g transform="translate(140, 455)">
    <rect x="0" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">10 Updates</text>

    <rect x="145" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="210" y="21" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">LLM &amp; Hardware</text>

    <rect x="290" y="0" width="130" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="355" y="21" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Daily Brief</text>
  </g>

  <!-- Branding / Logo mark -->
  <g transform="translate(970, 455)">
    <circle cx="20" cy="16" r="16" fill="url(#glow)"/>
    <text x="20" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">H</text>
    <text x="50" y="22" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Hermes AI</text>
  </g>
</svg>
