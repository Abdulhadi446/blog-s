<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="100" y1="0" x2="100" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#7c3aed" stroke-width="0.5"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#7c3aed" stroke-width="0.5"/>
  </g>
  <!-- Glowing orbs -->
  <circle cx="200" cy="150" r="120" fill="url(#glow)" opacity="0.4"/>
  <circle cx="1000" cy="450" r="150" fill="url(#glow)" opacity="0.3"/>
  <circle cx="600" cy="100" r="80" fill="#06b6d4" opacity="0.08"/>
  <!-- Neural network nodes -->
  <g opacity="0.15">
    <circle cx="150" cy="200" r="4" fill="#7c3aed"/>
    <circle cx="250" cy="280" r="3" fill="#06b6d4"/>
    <circle cx="180" cy="350" r="5" fill="#7c3aed"/>
    <circle cx="950" cy="180" r="4" fill="#06b6d4"/>
    <circle cx="1050" cy="300" r="3" fill="#7c3aed"/>
    <circle cx="1000" cy="400" r="5" fill="#06b6d4"/>
    <line x1="150" y1="200" x2="250" y2="280" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
    <line x1="250" y1="280" x2="180" y2="350" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
    <line x1="950" y1="180" x2="1050" y2="300" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
    <line x1="1050" y1="300" x2="1000" y2="400" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
  </g>
  <!-- Top accent bar -->
  <rect x="80" y="80" width="200" height="3" fill="url(#accent)" rx="1.5"/>
  <!-- AI icon (hexagram) -->
  <g transform="translate(80, 100)">
    <polygon points="0,-20 17.3,10 -17.3,10" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.6"/>
    <polygon points="0,20 -17.3,-10 17.3,-10" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#7c3aed" opacity="0.8"/>
  </g>
  <!-- Date badge -->
  <rect x="80" y="140" width="180" height="36" rx="18" fill="#7c3aed" opacity="0.15"/>
  <text x="170" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a78bfa" text-anchor="middle" letter-spacing="1">AUGUST 27, 2026</text>
  <!-- Main title -->
  <text x="80" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="#f1f5f9" letter-spacing="-1">AI Daily Roundup</text>
  <!-- Subtitle accent line -->
  <rect x="80" y="250" width="100" height="2" fill="url(#accent)" rx="1"/>
  <!-- Subtitle -->
  <text x="80" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.5">21 Stories Shaping AI News</text>
  <!-- Story highlight boxes -->
  <g transform="translate(80, 330)">
    <rect x="0" y="0" width="320" height="48" rx="8" fill="#7c3aed" opacity="0.1"/>
    <circle cx="20" cy="24" r="6" fill="#7c3aed" opacity="0.5"/>
    <text x="36" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c4b5fd" font-weight="500">Z.ai Unmasks Ox Alpha as GLM-5.3-Flash</text>
    <rect x="340" y="0" width="380" height="48" rx="8" fill="#06b6d4" opacity="0.1"/>
    <circle cx="360" cy="24" r="6" fill="#06b6d4" opacity="0.5"/>
    <text x="376" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#67e8f9" font-weight="500">Nvidia Warns of 15%+ AI Server Price Hikes</text>
    <rect x="740" y="0" width="380" height="48" rx="8" fill="#a78bfa" opacity="0.1"/>
    <circle cx="760" cy="24" r="6" fill="#a78bfa" opacity="0.5"/>
    <text x="776" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c4b5fd" font-weight="500">Faraday Beats OpenAI at Research Replication</text>
    <rect x="0" y="60" width="320" height="48" rx="8" fill="#06b6d4" opacity="0.1"/>
    <circle cx="20" cy="84" r="6" fill="#06b6d4" opacity="0.5"/>
    <text x="36" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#67e8f9" font-weight="500">Instinct AI Hits $2.5B Valuation</text>
    <rect x="340" y="60" width="380" height="48" rx="8" fill="#7c3aed" opacity="0.1"/>
    <circle cx="360" cy="84" r="6" fill="#7c3aed" opacity="0.5"/>
    <text x="376" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#c4b5fd" font-weight="500">Google DeepMind Reshuffle Under Brin</text>
    <rect x="740" y="60" width="380" height="48" rx="8" fill="#06b6d4" opacity="0.1"/>
    <circle cx="760" cy="84" r="6" fill="#06b6d4" opacity="0.5"/>
    <text x="776" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#67e8f9" font-weight="500">Wrtn Becomes Korea's First AI Unicorn</text>
  </g>
  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#0f0f23"/>
  <rect x="0" y="590" width="1200" height="1" fill="url(#accent)" opacity="0.3"/>
  <text x="600" y="615" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="2">AI DAILY ROUNDUP • HERMES AGENT • NOUS RESEARCH</text>
</svg>